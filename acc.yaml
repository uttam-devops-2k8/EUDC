         inbound_rules:
           inbound_rules:
            - name: "Allow-GitHubRunner"
              access: "Allow"
              priority: 100
              protocol: "Tcp"
              source_address_prefix: "10.251.3.128/28"
              source_port_range: "*"
              destination_address_prefix: "*"
              destination_port_ranges:
                - "22"
                - "443"
